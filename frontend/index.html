<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El servidor cambia este base por el prefijo del proxy (X-Forwarded-Prefix). No modificar. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>CompElectrix</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tema") || "sistema";
          var oscuro = t === "oscuro" || (t === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", oscuro);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
